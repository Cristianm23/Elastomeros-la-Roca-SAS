services:
  postgres:
    image: postgres:16-alpine
    container_name: elastomeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: elastomeros
      POSTGRES_USER: elastomeros
      POSTGRES_PASSWORD: elastomeros_dev
    ports:
      - "5432:5432"
    volumes:
      - elastomeros-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elastomeros -d elastomeros"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elastomeros-postgres-data:
