services:
  - type: web
    name: elastomeros-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /up
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: elastomeros-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: elastomeros-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: elastomeros-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: elastomeros-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: elastomeros-db
          property: password
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: FILESYSTEM_DISK
        value: s3
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: SALES_NOTIFICATION_EMAIL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false

  - type: worker
    name: elastomeros-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        fromService:
          type: web
          name: elastomeros-api
          envVarKey: APP_KEY
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: elastomeros-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: elastomeros-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: elastomeros-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: elastomeros-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: elastomeros-db
          property: password
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: SALES_NOTIFICATION_EMAIL
        sync: false

  - type: cron
    name: elastomeros-scheduler
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    schedule: "* * * * *"
    dockerCommand: php artisan schedule:run
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        fromService:
          type: web
          name: elastomeros-api
          envVarKey: APP_KEY

  - type: web
    name: elastomeros-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: elastomeros-db
    databaseName: elastomeros
    user: elastomeros
    plan: basic-256mb
